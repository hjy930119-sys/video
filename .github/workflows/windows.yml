name: Build Windows ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Windows FFmpeg
        run: npm ci --no-audit --no-fund
      - name: Test real video, image, caption and audio export
        run: npm test
      - name: Verify Electron window and preload
        run: '& .\node_modules\.bin\electron.cmd . --smoke-test'
      - name: Build Windows installer and portable EXE
        run: npm run dist:win
      - name: Verify packaged Windows FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe'
          if (!(Test-Path $ffmpeg)) { throw 'Packaged FFmpeg missing' }
          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged FFmpeg failed' }
      - name: Verify installed app and desktop shortcut
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (!$desktop) { $desktop = Join-Path $env:USERPROFILE 'Desktop' }
          New-Item -ItemType Directory -Force -Path $desktop | Out-Null
          $setup = (Get-ChildItem 'dist/Frame-Studio-*-Setup.exe').FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'FrameStudioInstall'
          $installer = Start-Process -FilePath $setup -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $exe = Join-Path $installDir 'Frame Studio.exe'
          if (!(Test-Path $exe)) { throw 'Installed EXE missing' }
          $shortcut = Join-Path $desktop 'Frame Studio.lnk'
          if (!(Test-Path $shortcut)) { throw 'Desktop shortcut missing' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.TargetPath -ne $exe) { throw 'Desktop shortcut points to wrong executable' }
          $app = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Installed app smoke test failed: $($app.ExitCode)" }
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Studio-Windows
          path: |
            dist/Frame-Studio-*.exe
            README.md
            THIRD_PARTY.md
            LICENSE
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Show download instructions
        shell: pwsh
        run: |
          '## Windows ZIP ready' >> $env:GITHUB_STEP_SUMMARY
          'Download **Frame-Studio-Windows** from **Artifacts** below, extract all files, then run **Setup.exe** to install with a desktop icon (or **Portable.exe** without installation).' >> $env:GITHUB_STEP_SUMMARY
